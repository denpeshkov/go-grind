name: CI

on:
  push:
    branches:
      - main

jobs:
  build_test:
    name: Build and Test
    env:
      GOTOOLCHAIN: local
    strategy:
      matrix:
        go-version: [1.26]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go ${{ matrix.go-version }} on ${{ matrix.os }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test
        run: go test -race -count=1 -shuffle=on ./...
